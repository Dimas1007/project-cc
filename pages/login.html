<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Lumina Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            margin: 1.5rem;
        }
    </style>
</head>

<body>
    <div class="glass login-card animate-fade">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <i class="fa-solid fa-book-open-reader gradient-text"></i>
                Lumina<span class="gradient-text">Lib</span>
            </a>
            <h2 style="font-size: 2rem;">Welcome <span class="gradient-text">Back</span></h2>
            <p style="color: var(--text-muted);">Please enter your details to sign in.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Sign In <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>

        <div style="margin-top: 2.5rem; text-align: center; color: var(--text-muted); font-size: 0.9375rem;">
            Don't have an account? <a href="register.html"
                style="color: var(--primary); text-decoration: none; font-weight: 700;">Create One</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';

            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const response = await api.auth.login(email, password);
                auth.setSession(response.data.accessToken, response.data.user);

                // Fancy success state
                btn.classList.replace('btn-primary', 'badge-available');
                btn.style.background = 'rgba(16, 185, 129, 0.2)';
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Success!';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerHTML = 'Sign In <i class="fa-solid fa-right-to-bracket"></i>';
            }
        };
    </script>
</body>

</html>
