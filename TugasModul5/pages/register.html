<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Lumina Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0; }
        .register-card { width: 100%; max-width: 550px; padding: 3rem; margin: 1.5rem; }
    </style>
</head>
<body>
    <div class="glass register-card animate-fade">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <i class="fa-solid fa-book-open-reader gradient-text"></i>
                Lumina<span class="gradient-text">Lib</span>
            </a>
            <h2 style="font-size: 2rem;">Join the <span class="gradient-text">Community</span></h2>
            <p style="color: var(--text-muted);">Start your literary journey with us today.</p>
        </div>

        <form id="register-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="08123456789" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="address" placeholder="Your full home address..." rows="2" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Create Account <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <div style="margin-top: 2.5rem; text-align: center; color: var(--text-muted); font-size: 0.9375rem;">
            Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 700;">Sign In</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registering...';

            try {
                const userData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value,
                    address: document.getElementById('address').value
                };
                await api.auth.register(userData);
                
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Success! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerHTML = 'Create Account <i class="fa-solid fa-user-plus"></i>';
            }
        };
    </script>
</body>
</html>
